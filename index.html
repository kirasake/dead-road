<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Мёртвая дорога</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html,body{margin:0;height:100%;background:#14180f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  #wrap{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto}
  canvas{display:block;width:100%;height:100%}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 30%,rgba(40,30,20,.78),rgba(8,8,6,.92));color:#fff;text-align:center;
    padding:18px 16px;gap:11px;box-sizing:border-box;overflow-y:auto}
  .hidden{display:none!important}
  h1{margin:0;font-size:38px;color:#ffd23f;text-shadow:0 3px 0 #a3322a,0 0 24px rgba(255,120,40,.45);line-height:1.05;letter-spacing:1px}
  p{margin:0;opacity:.85;max-width:320px;line-height:1.4;font-size:14px}
  .info{font-size:16px;line-height:1.6}
  .info b{color:#ffd23f}
  .btn{background:linear-gradient(#ffe066,#ffc21f);color:#2a1d00;border:0;border-radius:14px;padding:14px 44px;font-size:20px;font-weight:900;
    box-shadow:0 5px 0 #b8861a,0 8px 20px rgba(0,0,0,.4);cursor:pointer;font-family:inherit;letter-spacing:.5px}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b8861a}
  .btn2{background:#2c3328;color:#fff;border:2px solid #46523d;border-radius:12px;padding:10px 18px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .coins{font-size:22px;font-weight:900;color:#ffd23f;text-shadow:0 2px 0 #6b4d00}
  .shop{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%;max-width:350px}
  .up{background:linear-gradient(#2b3226,#20261c);border:2px solid #3d4a34;border-radius:12px;padding:7px 6px;color:#fff;font-family:inherit;cursor:pointer;text-align:center}
  .up .n{font-weight:800;font-size:13px}
  .up .l{font-size:11px;opacity:.7;margin-top:1px}
  .up .c{font-weight:900;color:#ffd23f;font-size:14px;margin-top:2px}
  .up.ok{border-color:#8a7a2a}
  .up.no{opacity:.45}
  .up.max .c{color:#7CFC8A}
  .up:active{transform:scale(.96)}
  .sub{font-size:12px;opacity:.55}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="menu" class="ov">
    <h1 id="mTitle">МЁРТВАЯ<br>ДОРОГА</h1>
    <p id="mText">Веди отряд пальцем, а стреляют бойцы сами.<br>🔵 Ворота добавляют бойцов, 🔴 отнимают, а выстрелами число в воротах можно поднять.
      Разбивай ящики и подбирай оружие на дороге. В конце каждого уровня ждёт босс.</p>
    <div class="info" id="mInfo"></div>
    <div class="coins">🪙 <span id="mCoins">0</span></div>
    <div class="shop" id="shop"></div>
    <button class="btn" id="mBtn">ИГРАТЬ</button>
    <div class="row"><button class="btn2" id="sndBtn"></button><button class="btn2" id="musBtn"></button></div>
    <div class="sub" id="mStats"></div>
  </div>

  <div id="pause" class="ov hidden">
    <h1>ПАУЗА</h1>
    <button class="btn" id="resBtn">ПРОДОЛЖИТЬ</button>
    <div class="row"><button class="btn2" id="sndBtn2"></button><button class="btn2" id="musBtn2"></button></div>
    <button class="btn2" id="quitBtn">Сдаться (монеты сохранятся)</button>
  </div>
</div>

<script>
// ================= Telegram =================
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const tgv = v => inTG && tg.isVersionAtLeast && tg.isVersionAtLeast(v);
try {
  if (inTG) {
    tg.ready(); tg.expand();
    if (tgv('7.7')) tg.disableVerticalSwipes();
    if (tgv('6.1')) { tg.setHeaderColor('#14180f'); tg.setBackgroundColor('#14180f'); }
  }
} catch (e) {}
const haptic = t => { try { if (tgv('6.1')) tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
const notify = t => { try { if (tgv('6.1')) tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const closeGuard = on => { try { if (tgv('6.2')) on ? tg.enableClosingConfirmation() : tg.disableClosingConfirmation(); } catch (e) {} };

// ================= сохранение =================
const UP_IDS = ['men', 'dmg', 'rate', 'gun', 'armor', 'magnet', 'income'];
function fixSave(s) {
  s = Object.assign({ level: 1, coins: 0, bestLevel: 1, kills: 0, playTime: 0, snd: true, mus: true, ts: 0 }, s || {});
  const up = {}; UP_IDS.forEach(k => up[k] = (s.up && s.up[k]) || 0); s.up = up;
  return s;
}
let SAVE = fixSave(null);
try { SAVE = fixSave(JSON.parse(localStorage.getItem('dr_save'))); } catch (e) {}
function persist() {
  SAVE.ts = Date.now();
  const str = JSON.stringify(SAVE);
  try { localStorage.setItem('dr_save', str); } catch (e) {}
  try { if (tgv('6.9')) tg.CloudStorage.setItem('save', str); } catch (e) {}
}
// облако Telegram — главный источник: берём более свежее сохранение
if (tgv('6.9')) tg.CloudStorage.getItem('save', (err, v) => {
  if (err || !v) { if (SAVE.ts) persist(); return; }
  try {
    const c = fixSave(JSON.parse(v));
    if (c.ts > SAVE.ts) { SAVE = c; try { localStorage.setItem('dr_save', v); } catch (e) {} applyAudioPrefs(); if (!G || G.over) renderMenu(menuMode); }
    else if (c.ts < SAVE.ts) persist();
  } catch (e) {}
});

// ================= звук (синтез в реальном времени + можно подложить mp3 в папку sfx) =================
let AC = null, NB = null, masterG, sfxG, musG, revIn, DIST = null;
// iPhone: звук мини-приложения глушится беззвучным режимом. Просим «медиа»-режим, как у видео
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
let unlockEl = null;
function silentWav() {
  const n = 4000, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, s) => [...s].forEach((c, i) => b[o + i] = c.charCodeAt(0));
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
  b.fill(128, 44);
  let s = ''; b.forEach(x => s += String.fromCharCode(x)); return 'data:audio/wav;base64,' + btoa(s);
}
function iosUnlock() {
  // тихий <audio loop> переводит iOS в режим воспроизведения медиа — WebAudio становится слышно с выключенным звонком
  if (!unlockEl) {
    unlockEl = document.createElement('audio');
    unlockEl.setAttribute('playsinline', ''); unlockEl.setAttribute('webkit-playsinline', '');
    unlockEl.loop = true; unlockEl.src = silentWav();
  }
  if (unlockEl.paused && !document.hidden) unlockEl.play().catch(() => {});
}
function audioInit() {
  iosUnlock();
  if (AC) { if (AC.state !== 'running' && !document.hidden) AC.resume().catch(() => {}); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' }); } catch (e) { return; }
  const unl = AC.createBufferSource(); unl.buffer = AC.createBuffer(1, 1, 22050); unl.connect(AC.destination); unl.start(0);
  if (AC.state !== 'running') AC.resume().catch(() => {});
  masterG = AC.createGain(); masterG.gain.value = 0.9;
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.18;
  masterG.connect(comp); comp.connect(AC.destination);
  sfxG = AC.createGain(); sfxG.connect(masterG);
  musG = AC.createGain(); musG.connect(masterG);
  // ревербератор (общий «зал» для эха)
  const len = Math.floor(AC.sampleRate * 1.7), ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
  const conv = AC.createConvolver(); conv.buffer = ir;
  revIn = AC.createGain(); const revOut = AC.createGain(); revOut.gain.value = 0.5;
  revIn.connect(conv); conv.connect(revOut); revOut.connect(masterG);
  NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  DIST = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; DIST[i] = (1 + 18) * x / (1 + 18 * Math.abs(x)); }
  applyAudioPrefs(); startMusic(); loadSfx();
}
function applyAudioPrefs() {
  if (sfxG) sfxG.gain.value = SAVE.snd ? 1 : 0;
  if (musG) musG.gain.value = SAVE.mus ? 0.55 : 0;
  ['', '2'].forEach(s => {
    const a = document.getElementById('sndBtn' + s), b = document.getElementById('musBtn' + s);
    if (a) a.textContent = SAVE.snd ? '🔊 Звук' : '🔇 Звук'; if (b) b.textContent = SAVE.mus ? '🎵 Музыка' : '🚫 Музыка';
  });
}
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, audioInit, true));
const sOK = () => AC && SAVE.snd && AC.state === 'running';

// --- кирпичики синтеза ---
function out(node, o) {
  node.connect(o.dest || sfxG);
  if (o.rev) { const s = AC.createGain(); s.gain.value = o.rev; node.connect(s); s.connect(revIn); }
}
function shapeEnv(g, t, dur, o) {
  const a = o.a || 0.002, v = o.vol == null ? 0.2 : o.vol;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a);
  if (o.hold) g.gain.setValueAtTime(v, t + a + o.hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function filt(n, t, dur, o) {
  if (!(o.lp || o.hp || o.bp)) return n;
  const fl = AC.createBiquadFilter(); fl.type = o.lp ? 'lowpass' : o.hp ? 'highpass' : 'bandpass';
  fl.frequency.setValueAtTime(o.lp || o.hp || o.bp, t);
  if (o.f2c) fl.frequency.exponentialRampToValueAtTime(o.f2c, t + dur);
  fl.Q.value = o.q || 0.8; n.connect(fl); return fl;
}
function dist(n) { const ws = AC.createWaveShaper(); ws.curve = DIST; ws.oversample = '2x'; n.connect(ws); return ws; }
function osc(type, f, dur, o = {}) {
  const t = o.t || AC.currentTime, x = AC.createOscillator(), g = AC.createGain();
  x.type = type; x.frequency.setValueAtTime(f, t);
  if (o.f2) x.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + (o.slide || dur));
  if (o.det) x.detune.value = o.det;
  if (o.vib) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibAmt || 8; l.connect(lg); lg.connect(x.frequency); l.start(t); l.stop(t + dur + 0.05); }
  let n = filt(x, t, dur, o); if (o.dist) n = dist(n);
  shapeEnv(g, t, dur, o); n.connect(g); out(g, o); x.start(t); x.stop(t + dur + 0.05);
}
function nz(dur, o = {}) {
  const t = o.t || AC.currentTime, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; fl.type = o.type || 'lowpass'; fl.frequency.setValueAtTime(o.f || 1000, t);
  if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
  fl.Q.value = o.q || 0.8; s.connect(fl);
  let n = o.dist ? dist(fl) : fl;
  shapeEnv(g, t, dur, o); n.connect(g); out(g, o); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
const lastS = {};
const can = (k, ms) => { const n = performance.now(); if (n - (lastS[k] || 0) < ms) return false; lastS[k] = n; return true; };

// --- звуки игры ---
const SFX = {
  shot(id) {
    if (!sOK() || !can('shot', 60)) return;
    const r = rnd(0.9, 1.1);
    switch (id) {
      case 0: nz(0.03, { type: 'highpass', f: 3000, vol: 0.22 }); nz(0.12, { type: 'bandpass', f: 1200 * r, f2: 450, vol: 0.3 }); osc('sine', 160 * r, 0.09, { f2: 50, vol: 0.32 }); break;
      case 1: nz(0.025, { type: 'highpass', f: 3500, vol: 0.22 }); nz(0.09, { type: 'bandpass', f: 1700 * r, f2: 650, vol: 0.27 }); osc('sine', 140 * r, 0.07, { f2: 45, vol: 0.28 }); break;
      case 2: nz(0.04, { type: 'highpass', f: 2500, vol: 0.3 }); nz(0.32, { f: 3200, f2: 180, vol: 0.45, dist: true, rev: 0.12 }); osc('sine', 110 * r, 0.22, { f2: 35, vol: 0.5 }); break;
      case 3: nz(0.02, { type: 'highpass', f: 4000, vol: 0.18 }); nz(0.05, { type: 'bandpass', f: 1900 * r, vol: 0.2 }); osc('sine', 120, 0.04, { f2: 50, vol: 0.18 }); break;
      case 4: osc('sawtooth', 1900 * r, 0.14, { f2: 220, vol: 0.08, lp: 5000 }); osc('square', 1890 * r, 0.12, { f2: 240, vol: 0.045, lp: 3500, det: 14, rev: 0.15 }); break;
      case 5: nz(0.42, { type: 'bandpass', f: 280, f2: 2600, q: 1.6, vol: 0.32, rev: 0.12 }); osc('sine', 90, 0.18, { f2: 40, vol: 0.4 }); break;
      case 6: osc('sine', 300 * r, 0.18, { f2: 1400, vol: 0.16, rev: 0.15 }); osc('square', 150 * r, 0.15, { f2: 700, vol: 0.05, lp: 2200 }); nz(0.14, { type: 'highpass', f: 5000, vol: 0.07 }); break;
    }
  },
  zdie() {
    if (!sOK() || !can('zd', 40)) return;
    const r = rnd(0.8, 1.25);
    nz(0.14, { f: 900, f2: 200, vol: 0.28 });
    osc('sawtooth', 115 * r, 0.32, { f2: 60, vol: 0.12, lp: 750, vib: 18, vibAmt: 14, a: 0.01 });
  },
  hurt() {
    if (!sOK() || !can('hu', 80)) return;
    nz(0.06, { type: 'bandpass', f: 500, vol: 0.25 });
    osc('triangle', 230 * rnd(0.9, 1.1), 0.15, { f2: 140, vol: 0.14, bp: 900, q: 1.2 });
  },
  coin() {
    if (!sOK() || !can('co', 45)) return;
    const t = AC.currentTime;
    osc('square', 1976, 0.07, { vol: 0.06, lp: 6000 }); osc('square', 2637, 0.2, { vol: 0.06, lp: 6000, t: t + 0.06, rev: 0.2 });
  },
  pickup() {
    if (!sOK()) return;
    const t = AC.currentTime;
    nz(0.03, { type: 'highpass', f: 2000, vol: 0.25 }); nz(0.03, { type: 'highpass', f: 1500, vol: 0.25, t: t + 0.09 });
    [523, 659, 784, 1047, 1319].forEach((f, i) => osc('triangle', f, 0.16, { vol: 0.12, t: t + 0.15 + i * 0.05, rev: 0.25 }));
  },
  good() {
    if (!sOK()) return;
    const t = AC.currentTime;
    osc('sine', 400, 0.35, { f2: 1200, vol: 0.18, rev: 0.2 }); osc('triangle', 800, 0.3, { f2: 2000, vol: 0.06, t: t + 0.05 });
    for (let i = 0; i < 4; i++) osc('sine', rnd(2000, 4000), 0.12, { vol: 0.04, t: t + 0.1 + i * 0.05, rev: 0.4 });
  },
  bad() {
    if (!sOK()) return;
    osc('sawtooth', 380, 0.45, { f2: 90, vol: 0.14, lp: 1500, vib: 12, vibAmt: 20 });
    osc('square', 190, 0.45, { f2: 45, vol: 0.06, lp: 800 });
  },
  thud() {
    if (!sOK() || !can('th', 50)) return;
    osc('triangle', 230 * rnd(0.9, 1.1), 0.06, { f2: 150, vol: 0.14 }); nz(0.05, { type: 'bandpass', f: 700, vol: 0.1 });
  },
  crate() {
    if (!sOK()) return;
    const t = AC.currentTime;
    nz(0.06, { type: 'highpass', f: 1500, vol: 0.32 });
    for (let i = 0; i < 4; i++) nz(0.08, { type: 'bandpass', f: rnd(800, 2500), q: 3, vol: 0.2, t: t + i * 0.04 });
    osc('triangle', 140, 0.25, { f2: 60, vol: 0.25 }); nz(0.35, { f: 1200, f2: 150, vol: 0.22, rev: 0.15 });
  },
  boom() {
    if (!sOK() || !can('bo', 80)) return;
    nz(0.05, { type: 'highpass', f: 2000, vol: 0.4 });
    nz(1.3, { f: 3500, f2: 60, vol: 0.65, dist: true, rev: 0.3 });
    osc('sine', 70, 0.9, { f2: 25, vol: 0.7 });
  },
  boss() {
    if (!sOK()) return;
    [-14, 0, 9].forEach(dt => osc('sawtooth', 78, 2.2, { f2: 45, det: dt * 10, vol: 0.12, lp: 900, f2c: 180, vib: 7, vibAmt: 8, a: 0.15, dist: true, rev: 0.35 }));
    nz(2, { type: 'bandpass', f: 450, f2: 140, q: 1, vol: 0.3, a: 0.2, rev: 0.3 });
  },
  spit() {
    if (!sOK() || !can('sp', 110)) return;
    nz(0.2, { type: 'bandpass', f: 600, f2: 2000, q: 4, vol: 0.25 }); osc('sine', 300, 0.1, { f2: 900, vol: 0.08, t: AC.currentTime + 0.05 });
  },
  win() {
    if (!sOK()) return;
    const t = AC.currentTime, seq = [[523, 659, 784], [587, 698, 880], [659, 784, 988], [1047, 1319, 1568]];
    seq.forEach((ch, i) => ch.forEach(f => {
      const dur = i === 3 ? 1.1 : 0.16;
      osc('square', f, dur, { vol: 0.045, lp: 3200, t: t + i * 0.15, hold: i === 3 ? 0.4 : 0, rev: 0.3 });
      osc('triangle', f / 2, dur, { vol: 0.06, t: t + i * 0.15, hold: i === 3 ? 0.4 : 0 });
    }));
  },
  lose() {
    if (!sOK()) return;
    const t = AC.currentTime;
    [392, 370, 349, 294].forEach((f, i) => osc('sawtooth', f, i === 3 ? 1.2 : 0.32, { vol: 0.08, lp: 1300, vib: 5, vibAmt: 6, t: t + i * 0.28, rev: 0.35 }));
    osc('sine', 73, 1.4, { vol: 0.25, t: t + 0.84 });
  },
  click() { if (!sOK()) return; osc('square', 1200, 0.03, { vol: 0.04, lp: 5000 }); osc('sine', 600, 0.05, { vol: 0.07 }); },
};

// ---- звуки из файлов (sfx/*.mp3, например из ElevenLabs). Нет файла — играет синтез ----
const SHOT_FILES = ['shot_pistol', 'shot_rifle', 'shot_shotgun', 'shot_minigun', 'shot_laser', 'shot_rocket', 'shot_plasma'];
const SFX_MAP = { zdie: 'zombie_die', hurt: 'soldier_hit', coin: 'coin', pickup: 'pickup', good: 'gate_good', bad: 'gate_bad',
  thud: 'crate_hit', crate: 'crate_break', boom: 'explosion', boss: 'boss_roar', spit: 'spit', win: 'win', lose: 'lose', click: 'click' };
const THR = { zombie_die: 45, soldier_hit: 90, coin: 50, crate_hit: 60, explosion: 80, spit: 120 };
const VOL = { zombie_die: 0.45, crate_hit: 0.35, coin: 0.5, click: 0.4, soldier_hit: 0.5 };
const BUF = {};
let musSrc = null;
function loadSfx() {
  // список файлов берётся из sfx/list.json (например ["coin","music"]) — так нет лишних запросов, если папки нет
  fetch('sfx/list.json').then(r => r.ok ? r.json() : []).catch(() => []).then(list => (list || []).forEach(n =>
    fetch('sfx/' + n + '.mp3').then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(a => AC.decodeAudioData(a)).then(b => { BUF[n] = b; if (n === 'music') startFileMusic(); }).catch(() => {})));
}
function playBuf(name) {
  const b = BUF[name]; if (!b) return false;
  if (!sOK()) return true;
  const ms = name.startsWith('shot_') ? 70 : (THR[name] || 0);
  if (ms && !can('f_' + name, ms)) return true;
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = b; s.playbackRate.value = rnd(0.94, 1.06);
  g.gain.value = name.startsWith('shot_') ? 0.3 : (VOL[name] || 0.7);
  s.connect(g); g.connect(sfxG); s.start();
  return true;
}
function startFileMusic() {
  if (musSrc) return;
  const g = AC.createGain(); g.gain.value = 1; g.connect(musG);
  musSrc = AC.createBufferSource(); musSrc.buffer = BUF.music; musSrc.loop = true; musSrc.connect(g); musSrc.start();
}
for (const k in SFX_MAP) { const synth = SFX[k]; SFX[k] = (...a) => { if (!playBuf(SFX_MAP[k])) synth(...a); }; }
{ const synthShot = SFX.shot; SFX.shot = id => { if (!playBuf(SHOT_FILES[id])) synthShot(id); }; }

// ================= музыка: генерируемый трек ля-минор, 126 BPM =================
// меню — пэды и мягкое арпеджио; бой — + барабаны и бас; босс — жёсткий бас, хэты 16-ми, быстрое арпеджио
const BPM = 126, STEP = 60 / BPM / 4;
const PROG = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]]; // Am F G Em
const ROOT = [45, 41, 43, 40];
const BASS_PAT = [0, 2, 3, 6, 8, 10, 11, 14];
let musStep = 0, musNext = 0, musTimer = null;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function startMusic() { if (musTimer) return; musNext = AC.currentTime + 0.1; musTimer = setInterval(schedMusic, 25); }
function schedMusic() {
  if (!AC || AC.state !== 'running') return;
  if (musSrc || !SAVE.mus || isPaused()) { musNext = AC.currentTime + 0.05; return; }
  const fight = G && !G.over, boss = fight && G.boss && !G.boss.dead;
  while (musNext < AC.currentTime + 0.15) {
    const t = musNext, s = musStep % 16, bar = Math.floor(musStep / 16), c = bar % 4, ch = PROG[c], root = ROOT[c];
    const secB = Math.floor(bar / 8) % 2 === 1, M = { dest: musG, t };
    // пэд — аккорд на весь такт
    if (s === 0) ch.forEach(n => [-7, 7].forEach(dt =>
      osc('sawtooth', mtof(n), STEP * 16, { ...M, vol: fight ? 0.018 : 0.026, lp: boss ? 1600 : 950, det: dt, a: 0.25, hold: STEP * 16 - 0.6, rev: 0.45 })));
    if (fight) {
      // бочка + щелчок
      if (s % 4 === 0) { osc('sine', 150, 0.28, { ...M, f2: 42, slide: 0.12, vol: 0.62 }); nz(0.015, { ...M, type: 'highpass', f: 3000, vol: 0.12 }); }
      if (boss && (s === 7 || s === 15)) osc('sine', 150, 0.2, { ...M, f2: 42, slide: 0.1, vol: 0.4 });
      // малый
      if (s === 4 || s === 12) { nz(0.2, { ...M, type: 'bandpass', f: 1800, q: 0.6, vol: 0.3, rev: 0.25 }); osc('triangle', 190, 0.08, { ...M, f2: 150, vol: 0.14 }); }
      // хэты
      if (boss || s % 2 === 0) nz(0.035, { ...M, type: 'highpass', f: 7500, vol: s % 4 === 2 ? 0.08 : 0.045 });
      if (secB && s % 4 === 2) nz(0.14, { ...M, type: 'highpass', f: 6500, vol: 0.045 });
      // бас
      if (BASS_PAT.includes(s)) {
        const oct = (s === 6 || s === 14) ? 12 : 0;
        osc('sawtooth', mtof(root + oct), STEP * 1.7, { ...M, vol: boss ? 0.1 : 0.13, lp: boss ? 1500 : 650, f2c: 180, dist: boss, a: 0.004 });
        osc('sine', mtof(root - 12 + oct), STEP * 1.7, { ...M, vol: 0.12 });
      }
      // арпеджио во второй части и на боссе
      if ((secB || boss) && (boss || s % 2 === 0)) {
        const n = ch[(s >> (boss ? 0 : 1)) % 3] + 12 + ((s >> 2) % 2 ? 12 : 0);
        osc('square', mtof(n), STEP * 0.9, { ...M, vol: boss ? 0.03 : 0.025, lp: 2600, rev: 0.3 });
      }
      // стабы на боссе
      if (boss && s === 0) ch.forEach(n => osc('sawtooth', mtof(n + 12), 0.25, { ...M, vol: 0.03, lp: 2500, dist: true }));
    } else {
      // меню: мягкий бас и арпеджио
      if (s === 0 || s === 10) osc('sine', mtof(root), STEP * 6, { ...M, vol: 0.14, a: 0.02 });
      if (s % 2 === 0) { const n = ch[(s >> 1) % 3] + 12; osc('triangle', mtof(n), STEP * 1.6, { ...M, vol: 0.04, rev: 0.4 }); }
      if (s % 4 === 2) nz(0.03, { ...M, type: 'highpass', f: 8000, vol: 0.025 });
    }
    musNext += STEP; musStep++;
  }
}

const RES = 3;
function mk(w, h, ax, ay, fn, res = RES) {
  const c = document.createElement('canvas'); c.width = Math.ceil(w * res); c.height = Math.ceil(h * res);
  const x = c.getContext('2d'); x.scale(res, res); fn(x, w, h);
  c.lw = w; c.lh = h; c.ax = ax; c.ay = ay; return c;
}
const spr = (c, x, y) => ctx.drawImage(c, x - c.ax, y - c.ay, c.lw, c.lh);
function C(x, cx, cy, r) { x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); }
function E(x, cx, cy, rx, ry) { x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); x.fill(); }
function RR(x, X, Y, w, h, r) {
  x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r);
  x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath();
}
function rg(x, cx, cy, r, a, b) { const g = x.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function shade(hex, k) { // k<0 темнее, k>0 светлее
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function whiten(c) {
  const w = mk(c.lw, c.lh, c.ax, c.ay, x => { x.drawImage(c, 0, 0, c.lw, c.lh); x.globalCompositeOperation = 'source-atop'; x.fillStyle = 'rgba(255,255,255,.85)'; x.fillRect(0, 0, c.lw, c.lh); });
  return w;
}

}

const fCache = {};
function formation(n) {
  if (fCache[n]) return fCache[n];
  const pts = [[0, 0]]; let ring = 1;
  while (pts.length < n) {
    const cnt = ring * 6, rad = ring * 15;
    for (let k = 0; k < cnt && pts.length < n; k++) {
      const a = k / cnt * Math.PI * 2 + ring * 0.5;
      pts.push([Math.cos(a) * rad, Math.sin(a) * rad * 0.8]);
    }
    ring++;
  }
  pts.hw = Math.max(...pts.map(p => Math.abs(p[0])));
  pts.hh = Math.max(...pts.map(p => Math.abs(p[1])));
  pts.order = pts.map((p, i) => i).sort((a, b) => pts[a][1] - pts[b][1]);
  return fCache[n] = pts;
}

function pickType() {
  const L = G.level, w = [['norm', 10]];
  if (L >= 2) w.push(['runner', Math.min(6, 2 + L)]);
  if (L >= 3) w.push(['tank', Math.min(4, L - 1)]);
  if (L >= 4) w.push(['boomer', Math.min(4, L - 2)]);
  if (L >= 6) w.push(['spitter', Math.min(3, L - 5)]);
  if (L >= 8) w.push(['armor', Math.min(4, L - 6)]);
  let s = w.reduce((a, b) => a + b[1], 0) * Math.random();
  for (const [k, v] of w) { s -= v; if (s <= 0) return k; }
  return 'norm';
}
function spawnZombie(x, y, type) {

  G.zombies.push({ type, x: clamp(x, ROAD_L + T.r, ROAD_R - T.r), y, hp, max: hp, r: T.r,
    spd: WORLD_V + rnd(...T.v) + Math.min(30, G.level * 1.5),
    track: type === 'runner' ? rnd(30, 50) : rnd(10, 30), wob: rnd(0, 6), hit: 0, spitT: rnd(1, 2.5) });
}
function spawnBoss() {
  const mega = G.mega, hp = Math.round((mega ? 260 : 110) * Math.pow(G.diff, 1.5));
  const b = { type: mega ? 'mega' : 'boss', x: MID, y: -60, hp, max: hp, r: ZT[mega ? 'mega' : 'boss'].r, spd: 50, track: 30, wob: 0, hit: 0,
    boss: true, biteT: 0, summonT: 3, slamT: 6 };

function rndGate() {

// ================= эффекты =================
function floatText(x, y, txt, col, size = 22, life = 1.1) { G.texts.push({ x, y, txt, col, size, life, max: life }); }
function burst(x, y, n, col, spd = 120) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(spd * 0.3, spd);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.3, 0.7), max: 0.7, r: rnd(1.5, 3.5), col });
  }

}
function ring(x, y, r, col) { G.rings.push({ x, y, r, col, life: 0.35 }); }
function decal(x, y, r, col = 'rgba(110,20,20,.55)') { G.decals.push({ x, y, r, col, rot: rnd(0, 3) }); if (G.decals.length > 70) G.decals.shift(); }
function addCoins(v) { v *= G.income; G.coins += v; G.runCoins += v; }
function bankCoins() { if (!G) return; const b = Math.floor(G.coins); SAVE.coins += b; G.coins -= b; }

// ================= логика =================
function setN(n) {
  G.n = clamp(Math.floor(n), 0, MAXN);
  if (G.n <= 0) lose();
}
function killSoldier(x, y) {
  if (G.over) return;
  if (Math.random() < G.armor) { burst(x, y, 4, '#cfd8dc', 80); return; }
  burst(x, y, 7, '#8b1e1e'); decal(x, y, 6);
  setN(G.n - 1); haptic('light'); SFX.hurt(); G.shake = Math.max(G.shake, 0.25); G.hurt = 0.25;
}
function explode(x, y, hurtSquad) {
  burst(x, y, 30, '#ff9f1c', 230); burst(x, y, 14, '#fff3a0', 120); ring(x, y, 60, '#ffb347'); decal(x, y, 22, 'rgba(25,20,15,.6)');
  G.shake = Math.max(G.shake, 0.5); haptic('heavy'); SFX.boom();
  for (const o of G.zombies) if (!o.dead && !o.boss && Math.hypot(o.x - x, o.y - y) < 55) hitZombie(o, 6 * G.diff);
  if (hurtSquad) {
    const pts = formation(Math.min(G.n, MAXDRAW)), SQY = sqY();
    let killed = 0;
    for (let i = 0; i < pts.length && killed < 8; i++)
      if (Math.hypot(G.squadX + pts[i][0] - x, SQY + pts[i][1] - y) < 42) { killSoldier(G.squadX + pts[i][0], SQY + pts[i][1]); killed++; }
  }

function hitZombie(z, d) {
  if (z.dead) return;
  const T = ZT[z.type];

  z.hp -= d; z.hit = 0.06;
  if (z.hp <= 0) {
    z.dead = true; G.kills++;
    addCoins(z.boss ? (z.type === 'mega' ? 80 : 30) + G.level * 10 : z.type === 'tank' || z.type === 'armor' ? 3 : 1);
    burst(z.x, z.y, z.boss ? 50 : 9, '#7a1d1d', z.boss ? 240 : 130); decal(z.x, z.y, z.r * 0.9);
    SFX.zdie();
    if (z.type === 'boomer') explode(z.x, z.y, false);
    if ((z.type === 'tank' || z.type === 'armor') && Math.random() < 0.25) spawnLoot(z.x, z.y, Math.random() < 0.5 ? 'wpn' : 'med');
    else if (!z.boss && Math.random() < 0.05) spawnLoot(z.x, z.y, 'coin');

}
function applyGate(s) {
  const before = G.n;
  if (s.op === '+') setN(G.n + s.v);
  else if (s.op === 'x') setN(G.n * s.v);
  else setN(G.n - s.v);
  if (G.over) return;
  const diff = G.n - before;
  floatText(G.squadX, sqY() - 60, (diff >= 0 ? '+' : '') + diff, diff >= 0 ? '#7CC8FF' : '#ff6b6b', 30);
  if (diff >= 0) { haptic('medium'); SFX.good(); } else { notify('error'); SFX.bad(); G.hurt = 0.3; }
}

  } else if (c.kind === 'wpn' && G.wpn < WPN.length - 1) {

function finish() {

function update(dt) {
  const g = G;
  g.shake = Math.max(0, g.shake - dt * 2); g.hurt = Math.max(0, g.hurt - dt);
  for (const p of g.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  g.parts = g.parts.filter(p => p.life > 0);
  for (const r of g.rings) r.life -= dt;
  g.rings = g.rings.filter(r => r.life > 0);
  for (const t of g.texts) { t.y -= (t.max > 1.5 ? 10 : 40) * dt; t.life -= dt; }
  g.texts = g.texts.filter(t => t.life > 0);
  if (g.over) {
    if (g.won) { g.dist += WORLD_V * dt; for (const p of g.props) p.y += WORLD_V * dt; }
    g.endT -= dt; if (g.endT <= 0 && !g.shown) { g.shown = true; finish(); }
    return;
  }

  g.t += dt; g.diff = 1 + (g.level - 1) * 0.75 + g.t / 30; g.dist += WORLD_V * dt;
  const SQY = sqY();

  // декор на обочинах
  g.propT -= WORLD_V * dt;
  if (g.propT <= 0) { g.propT = rnd(45, 110); addProp(-40); }
  for (const p of g.props) p.y += WORLD_V * dt;
  g.props = g.props.filter(p => p.y < H + 50);

  // движение
  if (keys.l) g.targetX -= 320 * dt;
  if (keys.r) g.targetX += 320 * dt;
  const pts = formation(Math.min(g.n, MAXDRAW));
  const hw = Math.min(pts.hw + 9, 145);
  g.targetX = clamp(g.targetX, ROAD_L + hw, ROAD_R - hw);
  g.squadX += (g.targetX - g.squadX) * Math.min(1, dt * 14);

  // стрельба
  const w = WPN[g.wpn];
  g.fireT -= dt; g.flash = Math.max(0, g.flash - dt);
  while (g.fireT <= 0) {
    g.fireT += 1 / (w.rate * g.rateMul);
    // стреляют бойцы по всей ширине толпы (каждый залп — другие), а не только центр
    const pel = w.pellets || 1, N = pts.length, k = Math.min(g.n, N, Math.floor(36 / pel)), dmg = w.dmg * g.dmgMul * g.n / k;
    const stride = N / k, shift = ((g.vol = (g.vol || 0) + 1) * 0.618 * stride) % stride;
    g.shooters = [];
    for (let i = 0; i < k; i++) {
      const idx = Math.floor(i * stride + shift) % N, p = pts[idx];
      const sx = g.squadX + p[0] + 4.5, sy = SQY + p[1] - 16;
      g.shooters.push(idx);
      // лёгкий автоприцел: ближайший зомби впереди в коридоре ±75px
      let aim = 0, bestD = 1e9;
      for (const z of g.zombies) {
        if (z.dead || z.y > sy - 10 || z.y < -20) continue;
        const dx = z.x - sx, dy = sy - z.y;
        if (Math.abs(dx) < 75 && dy < bestD) { bestD = dy; aim = Math.atan2(dx, dy); }
      }
      aim = clamp(aim, -0.4, 0.4);
      for (let j = 0; j < pel; j++) {
        const a = aim + (pel > 1 ? (j / (pel - 1) - 0.5) * w.spread * 2 + rnd(-0.03, 0.03) : rnd(-0.015, 0.015));
        g.bullets.push({ x: sx, y: sy - rnd(0, 8), vx: Math.sin(a) * 650, vy: -Math.cos(a) * 650,
          dmg, left: 1 + (w.pierce || 0), hitSet: w.pierce ? new Set() : null, life: pel > 1 ? 0.55 : 2 });
      }
    }
    g.flash = 0.05; SFX.shot(g.wpn);
  }

  // пули
  for (const b of g.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.y < -20 || b.life <= 0 || b.x < ROAD_L - 20 || b.x > ROAD_R + 20) { b.dead = true; continue; }
    for (const a of g.acid) {
      if (!a.dead && Math.abs(a.x - b.x) < 8 && Math.abs(a.y - b.y) < 10) { a.dead = true; burst(a.x, a.y, 6, '#9cff3a', 80); b.dead = true; break; }
    }
    if (b.dead) continue;
    for (const z of g.zombies) {
      if (z.dead || (b.hitSet && b.hitSet.has(z))) continue;
      const dx = b.x - z.x, dy = b.y - z.y;
      if (dx * dx + dy * dy < (z.r + 3) * (z.r + 3)) {
        hitZombie(z, b.dmg);
        if (w.splash) {
          burst(b.x, b.y, 5, w.col, 100); ring(b.x, b.y, w.splash * 0.7, w.col);
          for (const o of g.zombies) if (o !== z && !o.dead && Math.hypot(o.x - b.x, o.y - b.y) < w.splash) hitZombie(o, b.dmg * 0.6);
        } else burst(b.x, b.y, 2, '#7a1d1d', 60);
        if (b.hitSet) b.hitSet.add(z);
        if (--b.left <= 0) b.dead = true;
        break;
      }
    }
    if (b.dead || g.over) continue;
    for (const c of g.crates) {
      if (c.dead) continue;
      if (Math.abs(b.x - c.x) < c.w / 2 && Math.abs(b.y - c.y) < c.h / 2) {
        c.hp -= b.dmg; c.hit = 0.06; b.dead = true; SFX.thud();
        if (c.hp <= 0) breakCrate(c);
        break;
      }
    }
    if (b.dead) continue;
    // пули пролетают сквозь ворота (и бьют зомби за ними), но каждая один раз прибавляет число
    if (!b.gate) for (const gt of g.gates) {
      if (gt.used || Math.abs(b.y - gt.y) > 16) continue;
      const s = b.x < MID ? gt.L : gt.R;
      b.gate = true;
      if (s.op === 'x') break;
      s.flash = 0.06;
      s.prog += 1; // считаем попадания, а не урон — огромная толпа не раздувает ворота до небес
      const need = (12 + (s.op === '+' ? s.v : 0) * 2.5) * (1 + (g.level - 1) * 0.08);
      while (s.prog >= need) {
        s.prog -= need;
        if (s.op === '+') s.v++;
        else if (s.v > 1) s.v--;
        else { s.op = '+'; s.v = 1; }
      }
      break;
    }
  }
  g.bullets = g.bullets.filter(b => !b.dead);
  if (g.over) return;

  // зомби
  for (const z of g.zombies) {
    if (z.dead) continue;
    z.hit = Math.max(0, z.hit - dt); z.wob += dt * (z.type === 'runner' ? 16 : 8);
    if (z.boss) {
      const stopY = SQY - 180;
      if (z.y < stopY) z.y += z.spd * dt; else z.y += (z.type === 'mega' ? 16 : 12) * dt;
      z.summonT -= dt;
      if (z.summonT <= 0) {
        z.summonT = Math.max(1.3, 4 - g.level * 0.15);
        for (let i = 0; i < (z.type === 'mega' ? 5 : 3); i++) spawnZombie(z.x + rnd(-50, 50), z.y + 20, pickType());
      }
      if (z.type === 'mega') { // мега-босс плюётся веером
        z.slamT -= dt;
        if (z.slamT <= 0) { z.slamT = 3.5; for (let i = -2; i <= 2; i++) shootAcid(z.x, z.y + 30, g.squadX + i * 40, SQY); SFX.spit(); }
      }
    } else if (z.type === 'spitter' && z.y > H * 0.15 && z.y < SQY - 220) {
      z.y += 30 * dt; z.spitT -= dt;
      if (z.spitT <= 0) { z.spitT = rnd(2, 3); shootAcid(z.x, z.y + 10, g.squadX, SQY); SFX.spit(); }
    } else z.y += z.spd * dt;
    if (z.y > H * 0.2 && z.y < SQY) z.x += clamp((g.squadX - z.x) / 20, -1, 1) * z.track * dt;
    z.x = clamp(z.x, ROAD_L + z.r, ROAD_R - z.r);
    if (z.y > H + 50) { z.dead = true; continue; }
    if (Math.abs(z.y - SQY) < pts.hh + z.r + 10) {
      for (let i = 0; i < pts.length; i++) {
        const sx = g.squadX + pts[i][0], sy = SQY + pts[i][1];
        const dx = sx - z.x, dy = sy - z.y;
        if (dx * dx + dy * dy < (z.r + 8) * (z.r + 8)) {
          if (z.boss) {
            z.biteT -= dt;
            if (z.biteT <= 0) { z.biteT = 0.1; killSoldier(sx, sy); }
          } else if (z.type === 'boomer') { z.dead = true; explode(z.x, z.y, true); }
          else if (z.type === 'tank' || z.type === 'armor') {
            z.biteT = (z.biteT || 0) - dt;
            if (z.biteT <= 0) { z.biteT = 0.15; killSoldier(sx, sy); z.hp -= z.max * 0.25; if (z.hp <= 0) hitZombie(z, 1); }
          } else { z.dead = true; burst(z.x, z.y, 6, '#7a1d1d'); killSoldier(sx, sy); }
          break;
        }
      }
      if (g.over) return;
    }
  }
  g.zombies = g.zombies.filter(z => !z.dead);

  // кислота
  for (const a of g.acid) {
    a.x += a.vx * dt; a.y += a.vy * dt;
    if (a.y > SQY - pts.hh - 6 && Math.abs(a.x - g.squadX) < pts.hw + 8) {
      a.dead = true; burst(a.x, a.y, 10, '#9cff3a', 100); decal(a.x, a.y, 8, 'rgba(120,200,40,.45)');
      let best = 0, bd = 1e9;
      for (let i = 0; i < pts.length; i++) { const d = Math.hypot(g.squadX + pts[i][0] - a.x, SQY + pts[i][1] - a.y); if (d < bd) { bd = d; best = i; } }
      if (bd < 22) killSoldier(g.squadX + pts[best][0], SQY + pts[best][1]);
      if (g.over) return;
    }
    if (a.y > H + 20) a.dead = true;
  }
  g.acid = g.acid.filter(a => !a.dead);

  // ворота, ящики, лут
  for (const gt of g.gates) {
    gt.y += WORLD_V * dt;
    for (const s of [gt.L, gt.R]) s.flash = Math.max(0, (s.flash || 0) - dt);
    if (!gt.used && gt.y >= SQY) { gt.used = true; applyGate(g.squadX < MID ? gt.L : gt.R); if (g.over) return; }
  }
  g.gates = g.gates.filter(gt => gt.y < H + 50);
  for (const c of g.crates) { c.y += WORLD_V * dt; c.hit = Math.max(0, c.hit - dt); }
  g.crates = g.crates.filter(c => !c.dead && c.y < H + 60);
  const mr = g.magnet;
  for (const l of g.loot) {
    l.y += WORLD_V * dt; l.bob += dt * 5;
    if (mr && l.kind === 'coin' && Math.abs(l.y - SQY) < 120 + mr) { // магнит подтягивает монеты
      const dx = g.squadX - l.x; if (Math.abs(dx) < hw + mr + 20) l.x += clamp(dx, -1, 1) * 200 * dt;
    }
    if (Math.abs(l.y - SQY) < pts.hh + 18 + mr / 2 && Math.abs(l.x - g.squadX) < hw + 14 + mr) pickLoot(l);
  }
  g.loot = g.loot.filter(l => !l.dead && l.y < H + 40);
  for (const d of g.decals) d.y += WORLD_V * dt;
  g.decals = g.decals.filter(d => d.y < H + 30);

  // спавн
  const bossTime = g.t >= g.len;
  g.spawnZ -= dt;
  if (g.spawnZ <= 0) {
    g.spawnZ = Math.max(0.3, 1.25 / Math.sqrt(g.diff)) * (bossTime ? 2.5 : 1);
    const cnt = ri(1, Math.min(7, 1 + Math.floor(g.diff))), cx = rnd(ROAD_L + 30, ROAD_R - 30);
    if (!bossTime && Math.random() < 0.08) {
      for (let x = ROAD_L + 20; x < ROAD_R; x += 26) spawnZombie(x, -20 - rnd(0, 20), g.level >= 5 && Math.random() < 0.3 ? 'runner' : 'norm');
      floatText(MID, 90, 'ОРДА!', '#ff6b6b', 26);
    } else for (let i = 0; i < cnt; i++) spawnZombie(cx + rnd(-35, 35), -20 - rnd(0, 50), pickType());
  }
  if (!bossTime) {
    g.spawnO -= dt;
    if (g.spawnO <= 0) {
      g.spawnO = rnd(4, 5.5);
      const k = g.objToggle++ % 3;
      if (k === 0) spawnGates(); else if (k === 1) spawnCrates(); else spawnRoadLoot();
    }
  } else if (!g.bossSpawned) spawnBoss();
}
function shootAcid(x, y, tx, ty) {

}

function rr(x, y, w, h, r) { RR(ctx, x, y, w, h, r); }
function circle(x, y, r) { C(ctx, x, y, r); }
function txt(s, x, y, size, col, align = 'center') {

function drawGate(gt) {
  const h = 36, y = gt.y;
  ctx.globalAlpha = gt.used ? 0.3 : 1;
  [[gt.L, ROAD_L, MID], [gt.R, MID, ROAD_R]].forEach(([s, x0, x1]) => {
    const good = s.op !== '-';
    const gr = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
    gr.addColorStop(0, good ? 'rgba(90,180,255,.75)' : 'rgba(255,90,90,.75)');
    gr.addColorStop(1, good ? 'rgba(30,90,220,.45)' : 'rgba(200,30,30,.45)');
    ctx.fillStyle = s.flash > 0 ? 'rgba(255,255,255,.7)' : gr; ctx.fillRect(x0, y - h / 2, x1 - x0, h);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x0, y - h / 2, x1 - x0, 3);
    // косые блики
    ctx.save(); ctx.beginPath(); ctx.rect(x0, y - h / 2, x1 - x0, h); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    const sh = (performance.now() / 8) % 300;
    ctx.beginPath(); ctx.moveTo(x0 + sh - 60, y + h / 2); ctx.lineTo(x0 + sh - 30, y - h / 2); ctx.lineTo(x0 + sh - 10, y - h / 2); ctx.lineTo(x0 + sh - 40, y + h / 2); ctx.fill();
    ctx.restore();
    const label = s.op === 'x' ? '×' + s.v : (s.op === '+' ? '+' : '−') + s.v;
    txt(label, (x0 + x1) / 2, y + 1, 27, '#fff');
  });
  [ROAD_L - 4, MID, ROAD_R + 4].forEach(px => {
    const g2 = ctx.createLinearGradient(px - 5, 0, px + 5, 0); g2.addColorStop(0, '#555'); g2.addColorStop(0.5, '#aaa'); g2.addColorStop(1, '#444');
    ctx.fillStyle = g2; ctx.fillRect(px - 5, y - h / 2 - 8, 10, h + 16);
  });
  ctx.globalAlpha = 1;
}

function drawCrate(c) {

  ctx.fillStyle = c.hit > 0 ? '#f0f0f0' : gr; rr(x, y, c.w, c.h, 8); ctx.fill();

function drawLoot(l) {
  const y = l.y + Math.sin(l.bob) * 3;

    ctx.fillStyle = '#fff6b8'; ctx.beginPath(); ctx.ellipse(l.x - 2 * sq, y - 2, 2 * sq + 0.3, 2, 0, 0, 7); ctx.fill();

}

function drawZombie(z) {
  const T = ZT[z.type], s = z.r / 11, x = z.x, y = z.y;

  }

    circle(x, y, z.r + 10); ctx.restore();

  ctx.fillStyle = shade(T.skin, -0.1); circle(x - 9 * s, y + 14 * s + sw, 2.3 * s); circle(x + 9 * s, y + 14 * s - sw, 2.3 * s);

function drawSquad() {
  const g = G, SQY = sqY(), pts = formation(Math.min(g.n, MAXDRAW));
  for (const i of pts.order) spr(SOLDIER, g.squadX + pts[i][0], SQY + pts[i][1]);
  if (g.flash > 0) {

    for (const i of (g.shooters || []).slice(0, 20)) { if (!pts[i]) continue; const fx = g.squadX + pts[i][0] + 4.5, fy = SQY + pts[i][1] - 19; ctx.globalAlpha = 0.9; circle(fx, fy, 3.5); ctx.globalAlpha = 0.35; circle(fx, fy, 7); }

}

function drawBullets() {

function draw(now) {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (G && G.shake > 0) ctx.translate(rnd(-1, 1) * G.shake * 6, rnd(-1, 1) * G.shake * 6);
  const ti = G ? G.ti : (SAVE.level - 1) % THEMES.length;
  drawGround(G ? G.dist : now / 1000 * WORLD_V * 0.6, ti);
  if (G) {
    for (const d of G.decals) { ctx.fillStyle = d.col; ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * 0.65, d.rot, 0, Math.PI * 2); ctx.fill(); }
    for (const p of G.props) spr(p.img, p.x, p.y);
    G.gates.forEach(drawGate);
    G.crates.forEach(drawCrate);
    G.loot.forEach(drawLoot);
    G.zombies.forEach(drawZombie);
    if (G.n > 0) drawSquad();
    drawBullets();
    for (const a of G.acid) { ctx.fillStyle = 'rgba(156,255,58,.35)'; circle(a.x, a.y, 8); ctx.fillStyle = '#9cff3a'; circle(a.x, a.y, 4.5); ctx.fillStyle = '#eaffc0'; circle(a.x - 1.5, a.y - 1.5, 1.5); }
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const p of G.parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; circle(p.x, p.y, p.r); }
    ctx.restore();
    for (const r of G.rings) { const k = 1 - r.life / 0.35; ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.col; ctx.lineWidth = 4 * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.3 + k * 0.7), 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
    if (G.theme.dark) { // ночь: видно только вокруг отряда + фонари
      const gr = ctx.createRadialGradient(G.squadX, sqY() - 140, 70, G.squadX, sqY() - 140, 400);
      gr.addColorStop(0, 'rgba(0,0,12,0)'); gr.addColorStop(1, 'rgba(0,0,12,.85)');
      ctx.fillStyle = gr; ctx.fillRect(-10, -10, W + 20, H + 20);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const p of G.props) if (p.kind === 'lamp') { const lg = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 70); lg.addColorStop(0, 'rgba(255,220,140,.45)'); lg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = lg; circle(p.x, p.y, 70); }
      ctx.restore();
    }
    for (const t of G.texts) { ctx.globalAlpha = Math.min(1, t.life * 2); txt(t.txt, t.x, t.y, t.size, t.col); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  // виньетка + красная вспышка при потерях
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, G && G.hurt > 0 ? `rgba(200,0,0,${G.hurt * 1.6})` : 'rgba(0,0,0,.35)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (G && !G.over) drawHUD();
}

    const cls = max ? 'max' : SAVE.coins < cost ? 'no' : 'ok';
    return `<button class="up ${cls}" data-id="${u.id}">
      <div class="n">${u.name}</div><div class="l">${u.desc(l)}</div>
      <div class="c">${max ? 'МАКС' : '🪙 ' + cost}</div></button>`;
  }).join('');
  applyAudioPrefs();
}
$('shop').addEventListener('click', e => {
  const b = e.target.closest('.up'); if (!b) return;
  const u = UPS.find(x => x.id === b.dataset.id), l = SAVE.up[u.id];
  if (l >= u.max) return;
  const cost = upCost(u, l);
  if (SAVE.coins < cost) { notify('error'); SFX.bad(); return; }
  SAVE.coins -= cost; SAVE.up[u.id]++; persist(); notify('success'); SFX.pickup();
  renderMenu(menuMode);
});
$('mBtn').onclick = () => {
  audioInit(); SFX.click();
  $('menu').classList.add('hidden');
  userPaused = false; newGame(SAVE.level); haptic('medium');
};
function toggleSnd() { SAVE.snd = !SAVE.snd; applyAudioPrefs(); persist(); SFX.click(); }
function toggleMus() { SAVE.mus = !SAVE.mus; applyAudioPrefs(); persist(); SFX.click(); }
['sndBtn', 'sndBtn2'].forEach(id => $(id).onclick = toggleSnd);
['musBtn', 'musBtn2'].forEach(id => $(id).onclick = toggleMus);
function pauseGame() {
  if (!G || G.over || userPaused) return;
  userPaused = true; dragging = false; $('pause').classList.remove('hidden'); applyAudioPrefs();
  bankCoins(); persist();
}
function resumeGame() {
  if (!userPaused) return;
  userPaused = false; $('pause').classList.add('hidden'); last = performance.now(); SFX.click();
}
$('resBtn').onclick = resumeGame;
$('quitBtn').onclick = () => { $('pause').classList.add('hidden'); userPaused = false; lose(); };

// ================= цикл =================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G && !isPaused()) update(dt);
  draw(now);
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (G && !G.over) pauseGame(); else persist();
    if (AC) AC.suspend(); if (unlockEl) unlockEl.pause();
  } else { last = performance.now(); if (AC) AC.resume().catch(() => {}); if (unlockEl && AC) unlockEl.play().catch(() => {}); }
});
addEventListener('pagehide', () => { if (G && !G.over) bankCoins(); persist(); });
renderMenu('start');
requestAnimationFrame(loop);
</script>
</body>
</html>
